<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TORRE:SYSTEM // ULTIMATE PIXEL EDITION V7</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        retroDark: '#050811',
                        retroCard: '#0f172a',
                        retroBorder: '#1e293b',
                        retroGreen: '#10b981',
                        retroBlue: '#3b82f6',
                        retroPurple: '#8b5cf6',
                        retroGold: '#f59e0b',
                        retroRed: '#ef4444'
                    },
                    fontFamily: {
                        mono: ['Courier New', 'Courier', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        .pixel-font { font-family: 'VT323', monospace; letter-spacing: 1px; }
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }
        .pixel-border {
            box-shadow: 0 0 0 2px #0f172a, 0 0 0 4px #334155, inset 0 0 0 2px #1e293b;
        }
        .pixel-card {
            background: #0f172a;
            border: 2px solid #334155;
            box-shadow: 4px 4px 0px #020617;
        }
        .pixel-btn {
            position: relative;
            transition: all 0.1s ease;
            box-shadow: 3px 3px 0px #020617;
        }
        .pixel-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #020617;
        }
        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #020617;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-retroDark text-slate-100 font-mono min-h-screen flex flex-col items-center justify-between overflow-x-hidden select-none relative">
    
    <div class="crt-overlay absolute inset-0 z-50 pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="w-full max-w-md md:max-w-xl lg:max-w-2xl min-h-screen flex flex-col justify-between p-4 relative z-10">
        
        <!-- HEADER -->
        <header id="header-container" class="text-center py-2 border-b border-retroBorder mb-3">
            <h1 class="pixel-font text-3xl md:text-4xl text-cyan-400 font-bold tracking-widest drop-shadow-[0_0_10px_rgba(6,182,212,0.6)]">TORRE:SYSTEM // V7.0</h1>
            <p id="sub-header" class="text-xs text-slate-400 tracking-wider">SISTEMA TÁCTICO DE SUPERVIVENCIA EN TORRES</p>
        </header>

        <!-- DYNAMIC SCREEN CONTAINER -->
        <main id="main-view" class="flex-grow flex flex-col justify-center items-center my-2">
            <!-- Dynamically populated by JS -->
        </main>

        <!-- FOOTER -->
        <footer class="text-center py-2 text-[10px] text-slate-500 border-t border-retroBorder/50 mt-2">
            TORRE:SYSTEM ULTIMATE PIXEL EDITION &bull; ENGINE V7.0
        </footer>
    </div>

    <!-- NOTIFICATION MODAL / CUSTOM ALERT (Replaces alert()) -->
    <div id="toast-modal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 hidden">
        <div class="bg-retroCard border-2 border-retroBorder p-5 rounded max-w-sm w-full text-center pixel-border shadow-2xl">
            <h3 id="toast-title" class="pixel-font text-2xl text-yellow-400 mb-2">NOTIFICACIÓN</h3>
            <p id="toast-msg" class="text-sm text-slate-300 mb-4">Mensaje del sistema...</p>
            <button onclick="closeToast()" class="bg-cyan-600 hover:bg-cyan-500 text-black font-bold px-6 py-2 rounded pixel-font text-lg tracking-wider pixel-btn">ACEPTAR</button>
        </div>
    </div>

    <!-- IN-COMBAT POTION MODAL -->
    <div id="combat-potion-modal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 hidden">
        <div class="bg-retroCard border-2 border-retroBorder p-5 rounded max-w-sm w-full text-center pixel-border shadow-2xl">
            <h3 class="pixel-font text-2xl text-purple-400 mb-3">MOCHILA EN COMBATE</h3>
            <div id="combat-potion-list" class="space-y-2 mb-4 text-left max-h-60 overflow-y-auto">
                <!-- Populated by JS -->
            </div>
            <button onclick="closeCombatPotionModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold py-2 rounded pixel-font text-base border border-slate-600 pixel-btn">VOLVER AL COMBATE</button>
        </div>
    </div>

    <!-- MAIN GAME SCRIPT -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.12);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'crit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'victory') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'potion') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(850, now + 0.2);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'boss') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(70, now);
                osc.frequency.linearRampToValueAtTime(25, now + 0.4);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        const AVAILABLE_CLASSES = {
            warrior: { id: 'warrior', name: 'Guerrero', icon: '🛡️', color: 'text-red-400', border: 'border-red-500', hp: 240, str: 20, spd: 10, mag: 5, def: 16, luck: 5, skillName: 'Estocada Brutal', skillCost: 15, skillDesc: 'Golpe pesado con 170% de Fuerza.' },
            rogue: { id: 'rogue', name: 'Asesino', icon: '🗡️', color: 'text-emerald-400', border: 'border-emerald-500', hp: 170, str: 18, spd: 22, mag: 8, def: 9, luck: 18, skillName: 'Puñalada Sombra', skillCost: 12, skillDesc: 'Ataque rápido, letal y preciso.' },
            mage: { id: 'mage', name: 'Mago Arcano', icon: '🧙‍♂️', color: 'text-cyan-400', border: 'border-cyan-500', hp: 140, str: 9, spd: 13, mag: 25, def: 7, luck: 12, skillName: 'Rayo de Fuego', skillCost: 18, skillDesc: 'Lanza una descarga mágica destructiva.' },
            paladin: { id: 'paladin', name: 'Paladín', icon: '⚔️', color: 'text-amber-400', border: 'border-amber-500', hp: 210, str: 15, spd: 9, mag: 15, def: 18, luck: 8, skillName: 'Juicio Sagrado', skillCost: 16, skillDesc: 'Daño físico y sagrado combinado.' }
        };

        const RANDOM_TRAITS_POOL = [
            { name: 'Golpe Furioso', desc: '+4 Fuerza de ataque', effect: (p) => p.str += 4 },
            { name: 'Piel de Titanio', desc: '+5 Defensa natural', effect: (p) => p.def += 5 },
            { name: 'Sintonía Arcana', desc: '+30 Maná máximo', effect: (p) => { p.maxMp += 30; p.mp = p.maxMp; } },
            { name: 'Fortuna del Pícaro', desc: '+6 Suerte y Oro', effect: (p) => p.luck += 6 },
            { name: 'Vitalidad Inmortal', desc: '+50 PV máximos', effect: (p) => { p.maxHp += 50; p.hp = p.maxHp; } }
        ];

        const SHOP_ITEMS = [
            { id: 'pot_hp', name: 'Poción de Vida', type: 'potion', effect: 'hp', val: 50, price: 35, icon: '🔴', desc: 'Restaura 50 PV.' },
            { id: 'pot_mp', name: 'Poción de Mana', type: 'potion', effect: 'mp', val: 30, price: 30, icon: '🔵', desc: 'Restaura 30 PM.' },
            { id: 'eq_sword1', name: 'Espada de Hierro', type: 'weapon', slot: 'weapon', atk: 10, price: 120, icon: '🗡️', desc: 'Arma de hierro afilada. +10 ATK.' },
            { id: 'eq_helm1', name: 'Casco de Soldado', type: 'armor', slot: 'helmet', def: 6, price: 90, icon: '🪖', desc: 'Protección para la cabeza. +6 DEF.' },
            { id: 'eq_armor1', name: 'Cota de Malla', type: 'armor', slot: 'armor', def: 12, price: 180, icon: '🛡️', desc: 'Armadura corporal resistente. +12 DEF.' },
            { id: 'eq_boots1', name: 'Botas de Cuero', type: 'armor', slot: 'boots', spd: 5, def: 4, price: 85, icon: '👢', desc: 'Botas de explorador. +5 SPD, +4 DEF.' }
        ];

        const MONSTER_TYPES = [
            { name: 'Slime Azul Ácido', hp: 75, atk: 13, def: 4, exp: 35, gold: 20, type: 'slime', color: 'border-blue-500 text-blue-400', drop: 'Gelatina Azul', dropValue: 18 },
            { name: 'Slime Verde Tóxico', hp: 90, atk: 16, def: 5, exp: 45, gold: 26, type: 'slime', color: 'border-green-500 text-green-400', drop: 'Núcleo de Slime', dropValue: 22 },
            { name: 'Goblin Explorador', hp: 100, atk: 19, def: 7, exp: 55, gold: 32, type: 'goblin', color: 'border-amber-500 text-amber-400', drop: 'Oreja de Goblin', dropValue: 28 },
            { name: 'Goblin Asaltante', hp: 120, atk: 22, def: 9, exp: 70, gold: 42, type: 'goblin', color: 'border-red-500 text-red-400', drop: 'Daga Rota', dropValue: 38 }
        ];

        const BOSS_TYPES = [
            { name: 'Goblin Rey Cibernético', hp: 420, atk: 38, def: 17, exp: 320, gold: 240, type: 'boss', drop: 'Corona de Acero Goblin', dropValue: 200 },
            { name: 'Slime Prime Mutante', hp: 520, atk: 34, def: 20, exp: 380, gold: 280, type: 'boss', drop: 'Núcleo Líquido Cuántico', dropValue: 220 },
            { name: 'Guardián Mecánico de la Torre', hp: 680, atk: 46, def: 25, exp: 550, gold: 450, type: 'boss', drop: 'Engranaje de Titanio', dropValue: 350 }
        ];

        let game = {
            screen: 'title', // title, saves, create, lobby, floor, combat, inventory, shop, quests, npc
            currentSlot: 0,
            slots: [null, null, null],
            player: null,
            floor: 1,
            grid: [],
            fog: [],
            playerPos: { x: 3, y: 6 },
            enemy: null,
            npc: null,
            combatTurn: 1,
            combatLogText: 'Inicia el combate táctico...',
            bossDefeatedOnFloor: {},
            quests: [
                { id: 'q1', title: 'Caza de Slimes', desc: 'Derrota 3 Slimes en la torre.', targetType: 'slime', targetCount: 3, current: 0, rewardGold: 140, completed: false },
                { id: 'q2', title: 'Explorador Audaz', desc: 'Llega al piso 5 de la torre.', targetType: 'floor', targetCount: 5, current: 1, rewardGold: 200, completed: false }
            ]
        };

        function showToast(title, msg) {
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-modal').classList.remove('hidden');
            playSound('click');
        }

        function closeToast() {
            document.getElementById('toast-modal').classList.add('hidden');
            playSound('click');
        }

        function openCombatPotionModal() {
            const list = document.getElementById('combat-potion-list');
            list.innerHTML = '';
            const potions = game.player.inventory.filter(i => i.type === 'potion');
            if (potions.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-400">No tienes pociones en la mochila.</p>';
            } else {
                potions.forEach((pot, idx) => {
                    list.innerHTML += `
                        <div class="flex items-center justify-between bg-slate-900 p-2 rounded border border-slate-700">
                            <span class="text-xs">${pot.icon} ${pot.name}</span>
                            <button onclick="usePotionInCombat(${idx})" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-1 rounded text-xs font-bold pixel-btn">USAR</button>
                        </div>
                    `;
                });
            }
            document.getElementById('combat-potion-modal').classList.remove('hidden');
            playSound('click');
        }

        function closeCombatPotionModal() {
            document.getElementById('combat-potion-modal').classList.add('hidden');
            playSound('click');
        }

        function usePotionInCombat(index) {
            const potions = game.player.inventory.filter(i => i.type === 'potion');
            const pot = potions[index];
            const realIdx = game.player.inventory.indexOf(pot);
            if (realIdx > -1) {
                game.player.inventory.splice(realIdx, 1);
                if (pot.effect === 'hp') {
                    game.player.hp = Math.min(game.player.maxHp, game.player.hp + pot.val);
                    game.combatLogText = `¡Usaste ${pot.name} y recuperaste ${pot.val} PV!`;
                } else if (pot.effect === 'mp') {
                    game.player.mp = Math.min(game.player.maxMp, game.player.mp + pot.val);
                    game.combatLogText = `¡Usaste ${pot.name} y recuperaste ${pot.val} PM!`;
                }
                playSound('potion');
                closeCombatPotionModal();
                renderScreen();
            }
        }

        function renderScreen() {
            const mainView = document.getElementById('main-view');
            mainView.innerHTML = '';

            if (game.screen === 'title') {
                renderTitleScreen(mainView);
            } else if (game.screen === 'saves') {
                renderSavesScreen(mainView);
            } else if (game.screen === 'create') {
                renderCreateScreen(mainView);
            } else if (game.screen === 'lobby') {
                renderLobbyScreen(mainView);
            } else if (game.screen === 'floor') {
                renderFloorScreen(mainView);
            } else if (game.screen === 'combat') {
                renderCombatScreen(mainView);
            } else if (game.screen === 'inventory') {
                renderInventoryScreen(mainView);
            } else if (game.screen === 'shop') {
                renderShopScreen(mainView);
            } else if (game.screen === 'quests') {
                renderQuestsScreen(mainView);
            } else if (game.screen === 'npc') {
                renderNpcScreen(mainView);
            }
        }

        function renderTitleScreen(container) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center space-y-6 w-full max-w-md py-6">
                    <div class="pixel-card p-6 rounded-lg w-full border-2 border-cyan-500/50 shadow-[0_0_20px_rgba(6,182,212,0.2)]">
                        <!-- Pixel Art Hero & Tower Illustration -->
                        <div class="text-6xl mb-3 animate-pulse">🏰⚡</div>
                        <h2 class="pixel-font text-3xl text-cyan-300 font-bold mb-1">TORRE:SYSTEM</h2>
                        <p class="text-xs text-slate-400 mb-6">EDICIÓN PIXEL ULTIMATE V7</p>
                        <button onclick="goToSaves()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-black font-bold py-3 px-6 rounded pixel-font text-2xl tracking-wider pixel-btn border-2 border-cyan-400">
                            JUGAR
                        </button>
                    </div>
                    <div class="text-[11px] text-slate-500 space-y-1">
                        <p>&bull; Exploración de Mazmorras Tácticas</p>
                        <p>&bull; Jefes de Piso Exclusivos & Sistema de Rasgos</p>
                    </div>
                </div>
            `;
        }

        function goToSaves() {
            game.screen = 'saves';
            playSound('click');
            renderScreen();
        }

        function renderSavesScreen(container) {
            let slotsHtml = '';
            for (let i = 0; i < 3; i++) {
                const save = game.slots[i];
                if (save) {
                    slotsHtml += `
                        <div class="pixel-card p-4 rounded mb-3 flex items-center justify-between border border-slate-700">
                            <div>
                                <span class="pixel-font text-xl text-yellow-400">RANURA ${i+1}: ${save.name}</span>
                                <p class="text-xs text-slate-400">Clase: ${AVAILABLE_CLASSES[save.classId].name} | Piso: ${save.floor} | Oro: ${save.gold}g</p>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="loadGameSlot(${i})" class="bg-green-600 hover:bg-green-500 text-black px-3 py-1 rounded text-xs font-bold pixel-font pixel-btn">CARGAR</button>
                                <button onclick="deleteGameSlot(${i})" class="bg-red-600 hover:bg-red-500 text-black px-3 py-1 rounded text-xs font-bold pixel-font pixel-btn">BORRAR</button>
                            </div>
                        </div>
                    `;
                } else {
                    slotsHtml += `
                        <div class="pixel-card p-4 rounded mb-3 flex items-center justify-between border border-dashed border-slate-700">
                            <div>
                                <span class="pixel-font text-xl text-slate-500">RANURA ${i+1}: VACÍA</span>
                                <p class="text-xs text-slate-500">Sin partida guardada</p>
                            </div>
                            <button onclick="startNewGameInSlot(${i})" class="bg-cyan-600 hover:bg-cyan-500 text-black px-4 py-2 rounded text-xs font-bold pixel-font pixel-btn">NUEVA PARTIDA</button>
                        </div>
                    `;
                }
            }

            container.innerHTML = `
                <div class="w-full max-w-md">
                    <h3 class="pixel-font text-2xl text-cyan-400 mb-4 text-center">SELECCIONAR RANURA DE PARTIDA</h3>
                    <div class="space-y-2 mb-6">${slotsHtml}</div>
                    <button onclick="game.screen='title'; renderScreen();" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded pixel-font text-base pixel-btn">VOLVER AL MENÚ</button>
                </div>
            `;
        }

        function startNewGameInSlot(slotIdx) {
            game.currentSlot = slotIdx;
            game.screen = 'create';
            playSound('click');
            renderScreen();
        }

        function loadGameSlot(slotIdx) {
            game.currentSlot = slotIdx;
            game.player = JSON.parse(JSON.stringify(game.slots[slotIdx]));
            game.floor = game.player.floor || 1;
            game.screen = 'lobby';
            playSound('victory');
            renderScreen();
        }

        function deleteGameSlot(slotIdx) {
            game.slots[slotIdx] = null;
            playSound('hit');
            renderScreen();
        }

        let tempChar = {
            name: 'Héroe',
            classId: 'warrior',
            trait: null
        };

        function renderCreateScreen(container) {
            if (!tempChar.trait) {
                tempChar.trait = RANDOM_TRAITS_POOL[Math.floor(Math.random() * RANDOM_TRAITS_POOL.length)];
            }

            let classCards = '';
            Object.keys(AVAILABLE_CLASSES).forEach(key => {
                const c = AVAILABLE_CLASSES[key];
                const selected = tempChar.classId === key ? 'border-cyan-400 bg-cyan-950/40 shadow-[0_0_10px_rgba(6,182,212,0.4)]' : 'border-slate-700 bg-slate-900';
                classCards += `
                    <div onclick="selectClass('${key}')" class="pixel-card p-3 rounded cursor-pointer border-2 ${selected} flex items-center space-x-3 pixel-btn">
                        <span class="text-3xl">${c.icon}</span>
                        <div class="text-left">
                            <h4 class="pixel-font text-lg ${c.color}">${c.name}</h4>
                            <p class="text-[11px] text-slate-400">PV: ${c.hp} | ATK: ${c.str} | DEF: ${c.def}</p>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="w-full max-w-md">
                    <h3 class="pixel-font text-2xl text-cyan-400 mb-3 text-center">CREAR NUEVO HÉROE</h3>
                    <div class="space-y-3 mb-4">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1 pixel-font">NOMBRE DEL HÉROE:</label>
                            <input type="text" id="hero-name-input" value="${tempChar.name}" class="w-full bg-slate-900 border-2 border-slate-700 p-2 rounded text-cyan-300 pixel-font text-lg focus:outline-none focus:border-cyan-400" />
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1 pixel-font">SELECCIONAR CLASE:</label>
                            <div class="space-y-2">${classCards}</div>
                        </div>
                        <div class="bg-purple-950/40 border-2 border-purple-500/50 p-3 rounded">
                            <span class="text-xs text-purple-300 pixel-font font-bold">RASGO ÚNICO ASIGNADO:</span>
                            <p class="text-sm text-yellow-300 font-bold">${tempChar.trait.name}</p>
                            <p class="text-[11px] text-slate-300">${tempChar.trait.desc}</p>
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="confirmCreateHero()" class="flex-grow bg-green-600 hover:bg-green-500 text-black font-bold py-2 rounded pixel-font text-xl pixel-btn">INICIAR AVENTURA</button>
                        <button onclick="game.screen='saves'; renderScreen();" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded pixel-font text-base pixel-btn">CANCELAR</button>
                    </div>
                </div>
            `;
        }

        function selectClass(classId) {
            tempChar.classId = classId;
            playSound('click');
            renderScreen();
        }

        function confirmCreateHero() {
            const nameInput = document.getElementById('hero-name-input');
            if (nameInput && nameInput.value.trim() !== '') {

        function enterFloor() {
            game.screen = 'floor';

        function generateFloorMap() {
            const size = 7;
            game.grid = [];
            game.fog = [];
            
            for (let y = 0; y < size; y++) {
                let row = [];
                let fogRow = [];
                for (let x = 0; x < size; x++) {
                    row.push('empty');
                    fogRow.push(false); // fog of war: false means hidden
                }
                game.grid.push(row);
                game.fog.push(fogRow);
            }

            game.playerPos = { x: 3, y: 6 };
            game.fog[6][3] = true; // start position explored

            const isBossFloor = (game.floor % 10 === 0);

            if (isBossFloor) {
                // Boss floor has ONLY the boss at (3, 2) and up stairs at (3, 1)
                game.grid[2][3] = 'boss';
                game.grid[1][3] = 'stairs_up';
                // Down stairs to return to previous floor
                if (game.floor > 1) {
                    game.grid[6][1] = 'stairs_down';
                }
            } else {
                // Regular floor: monsters, chest, down stairs, up stairs
                game.grid[1][3] = 'stairs_up';
                if (game.floor > 1) {
                    game.grid[6][1] = 'stairs_down';
                }

                // Place 3 monsters hidden under fog
                let monstersPlaced = 0;
                while (monstersPlaced < 3) {
                    let rx = Math.floor(Math.random() * size);
                    let ry = Math.floor(Math.random() * 5) + 1;
                    if (game.grid[ry][rx] === 'empty' && !(rx === 3 && ry === 6)) {
                        game.grid[ry][rx] = 'monster';
                        monstersPlaced++;
                    }
                }

                // Place 1 treasure chest
                let chestPlaced = false;
                while (!chestPlaced) {
                    let rx = Math.floor(Math.random() * size);
                    let ry = Math.floor(Math.random() * 5) + 1;
                    if (game.grid[ry][rx] === 'empty' && !(rx === 3 && ry === 6)) {
                        game.grid[ry][rx] = 'chest';
                        chestPlaced = true;
                    }
                }
            }

            revealAdjacentFog();
        }

        function revealAdjacentFog() {
            const px = game.playerPos.x;
            const py = game.playerPos.y;
            game.fog[py][px] = true;
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    let nx = px + dx;
                    let ny = py + dy;
                    if (nx >= 0 && nx < 7 && ny >= 0 && ny < 7) {
                        game.fog[ny][nx] = true;
                    }
                }
            }
        }

        function movePlayer(dx, dy) {
            let nx = game.playerPos.x + dx;
            let ny = game.playerPos.y + dy;

            if (nx < 0 || nx >= 7 || ny < 0 || ny < 7) return;

            game.playerPos.x = nx;
            game.playerPos.y = ny;
            revealAdjacentFog();

            let tile = game.grid[ny][nx];

            if (tile === 'monster') {
                game.grid[ny][nx] = 'empty';
                const baseMon = MONSTER_TYPES[Math.floor(Math.random() * MONSTER_TYPES.length)];
                game.enemy = JSON.parse(JSON.stringify(baseMon));
                // Scale monster stats with floor
                game.enemy.hp += (game.floor - 1) * 12;
                game.enemy.maxHp = game.enemy.hp;
                game.enemy.atk += (game.floor - 1) * 3;
                game.screen = 'combat';
                game.combatTurn = 1;
                game.combatLogText = `¡Un ${game.enemy.name} salvaje apareció en el piso ${game.floor}!`;
                playSound('boss');
            } else if (tile === 'boss') {
                const baseBoss = BOSS_TYPES[Math.floor((game.floor / 10 - 1) % BOSS_TYPES.length)];
                game.enemy = JSON.parse(JSON.stringify(baseBoss));
                game.enemy.hp += (game.floor - 1) * 30;
                game.enemy.maxHp = game.enemy.hp;
                game.enemy.atk += (game.floor - 1) * 6;
                game.screen = 'combat';
                game.combatTurn = 1;
                game.combatLogText = `¡JEFE DE PISO: ${game.enemy.name}! Derrótalo para avanzar.`;
                playSound('boss');
            } else if (tile === 'chest') {
                game.grid[ny][nx] = 'empty';
                let goldFound = 40 + game.floor * 15;
                game.player.gold += goldFound;
                showToast('¡TESORO ENCONTRADO!', `Has abierto un cofre y encontrado ${goldFound} monedas de oro.`);
                playSound('victory');
            } else if (tile === 'stairs_up') {
                const isBossFloor = (game.floor % 10 === 0);
                if (isBossFloor && game.enemy && game.enemy.hp > 0) {
                    showToast('BLOQUEADO', '¡Debes derrotar al jefe del piso antes de subir!');
                } else {
                    game.floor++;
                    // Check quests progress
                    game.quests.forEach(q => {
                        if (q.targetType === 'floor' && game.floor >= q.targetCount && !q.completed) {
                            q.completed = true;
                            game.player.gold += q.rewardGold;
                            showToast('¡MISIÓN CUMPLIDA!', `Completaste "${q.title}" y ganaste ${q.rewardGold}g.`);
                        }
                    });
                    showToast('ASCENSO', `Has subido al Piso ${game.floor}.`);
                    generateFloorMap();
                }
            } else if (tile === 'stairs_down') {
                if (game.floor > 1) {
                    game.floor--;
                    showToast('DESCENSO', `Has bajado al Piso ${game.floor}.`);
                    generateFloorMap();
                }
            }

            playSound('click');
            renderScreen();
        }

        function combatAction(action) {
            const p = game.player;
            const e = game.enemy;

            if (action === 'attack') {
                let totalAtk = p.str + (p.equipment.weapon ? p.equipment.weapon.atk : 0);
                let dmgToEnemy = Math.max(4, totalAtk - Math.floor(e.def / 2) + Math.floor(Math.random() * 6));
                let isCrit = Math.random() < (p.luck * 0.02);
                if (isCrit) {
                    dmgToEnemy = Math.floor(dmgToEnemy * 1.5);
                    playSound('crit');
                    game.combatLogText = `¡GOLPE CRÍTICO! Atacaste a ${e.name} causando ${dmgToEnemy} de daño.`;
                } else {
                    playSound('hit');
                    game.combatLogText = `Atacaste a ${e.name} causando ${dmgToEnemy} de daño.`;
                }
                e.hp -= dmgToEnemy;

            } else if (action === 'skill') {
                const c = AVAILABLE_CLASSES[p.classId];
                if (p.mp < 15) {
                    game.combatLogText = '¡No tienes suficiente Maná para usar la habilidad!';
                    playSound('click');
                    renderScreen();
                    return;
                }
                p.mp -= 15;
                let skillDmg = Math.floor((p.str + p.mag) * 1.6) - Math.floor(e.def / 2);
                skillDmg = Math.max(15, skillDmg);
                playSound('crit');
                e.hp -= skillDmg;
                game.combatLogText = `¡Usaste ${c.skillName}! Causaste ${skillDmg} de daño mágico destructivo a ${e.name}.`;

            } else if (action === 'flee') {
                playSound('click');
                showToast('HUIDA', 'Lograste escapar del combate y regresar al piso.');
                game.screen = 'floor';
                renderScreen();
                return;
            }

            // Check if enemy defeated
            if (e.hp <= 0) {
                playSound('victory');
                let rewardGold = e.gold || 30;
                let rewardExp = e.exp || 40;
                p.gold += rewardGold;
                p.exp += rewardExp;

                // Add drop item to inventory
                if (e.drop) {
                    p.inventory.push({
                        id: 'drop_' + Date.now(),
                        name: e.drop,
                        type: 'material',
                        price: e.dropValue || 20,
                        icon: '💎',
                        desc: 'Objeto valioso obtenido de un monstruo derrotado. Puede venderse en la tienda.'
                    });
                }

                // Check quests
                game.quests.forEach(q => {
                    if (q.targetType === 'slime' && e.type === 'slime' && !q.completed) {
                        q.current++;
                        if (q.current >= q.targetCount) {
                            q.completed = true;
                            p.gold += q.rewardGold;
                            showToast('¡MISIÓN CUMPLIDA!', `Completaste "${q.title}" y ganaste ${q.rewardGold}g.`);
                        }
                    }
                });

                showToast('¡VICTORIA!', `Derrotaste a ${e.name}! Ganaste ${rewardGold}g y ${rewardExp} EXP.`);
                game.screen = 'floor';
                renderScreen();
                return;
            }

            // Enemy counter-attack
            let dmgToPlayer = Math.max(3, e.atk - Math.floor((p.def + (p.equipment.armor ? p.equipment.armor.def : 0)) / 2) + Math.floor(Math.random() * 5));
            p.hp -= dmgToPlayer;
            game.combatLogText += ` | ${e.name} ripostó y te causó ${dmgToPlayer} de daño.`;
            playSound('hit');

            if (p.hp <= 0) {
                p.hp = 0;
                playSound('hit');
                showToast('GAME OVER', 'Has caído en combate dentro de la torre...');
                game.screen = 'lobby';
                p.hp = p.maxHp; // restore for next attempt
                renderScreen();
                return;
            }

            renderScreen();
        }

            const p = game.player;

                showToast('POCIÓN USADA', `Recuperaste ${item.val} PV.`);

            p.inventory.splice(index, 1);
            playSound('potion');
            renderScreen();

            if (p.equipment[slotName]) {
                p.inventory.push(p.equipment[slotName]);

            p.equipment[slotName] = item;
            p.inventory.splice(index, 1);
            playSound('victory');
            showToast('EQUIPADO', `Te has equipado ${item.name}.`);

            if (sellableItems.length > 0) {
                sellableItems.forEach((item) => {
                    const realIdx = p.inventory.indexOf(item);
                    sellHtml += `
                        <div class="pixel-card p-2 rounded mb-2 flex items-center justify-between border border-slate-700 text-xs">
                            <div class="flex items-center space-x-2">
                                <span class="text-xl">${item.icon}</span>
                                <div>
                                    <span class="text-emerald-300 font-bold">${item.name} (Vender: ${item.price}g)</span>
                                </div>
                            </div>
                            <button onclick="sellMaterialItem(${realIdx})" class="bg-emerald-600 hover:bg-emerald-500 text-black px-3 py-1 rounded font-bold pixel-btn">VENDER</button>
                        </div>
                    `;
                });
            } else {
                sellHtml = '<p class="text-[11px] text-slate-500 text-center">No tienes materiales para vender.</p>';
            }

            container.innerHTML = `
                <div class="w-full max-w-md">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="pixel-font text-2xl text-yellow-400">TIENDA GENERAL</h3>
                        <span class="text-xs text-yellow-400 font-bold">${p.gold}g 💰</span>
                    </div>
                    <div class="max-h-40 overflow-y-auto mb-3 space-y-1">${shopHtml}</div>
                    <h4 class="pixel-font text-lg text-emerald-400 mb-2">VENDER MATERIALES</h4>
                    <div class="max-h-32 overflow-y-auto mb-3 space-y-1">${sellHtml}</div>
                    <button onclick="game.screen='lobby'; renderScreen();" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded pixel-font text-sm pixel-btn">VOLVER AL LOBBY</button>
                </div>
            `;
        }

        function buyShopItem(index) {
            const p = game.player;
            const item = SHOP_ITEMS[index];
            if (p.gold < item.price) {
                showToast('FONDOS INSUFICIENTES', 'No tienes suficiente oro para comprar este objeto.');
                return;
            }
            p.gold -= item.price;
            p.inventory.push(JSON.parse(JSON.stringify(item)));
            playSound('victory');
            showToast('COMPRA EXITOSA', `Has comprado ${item.name}.`);
            renderScreen();
        }

        function sellMaterialItem(index) {
            const p = game.player;
            const item = p.inventory[index];
            p.gold += item.price;
            p.inventory.splice(index, 1);
            playSound('victory');
            showToast('VENTA EXITOSA', `Vendiste ${item.name} por ${item.price}g.`);
            renderScreen();
        }

        function renderQuestsScreen(container) {
            let questsHtml = '';
            game.quests.forEach(q => {
                questsHtml += `
                    <div class="pixel-card p-3 rounded mb-2 border border-slate-700 text-xs">
                        <div class="flex justify-between items-center mb-1">
                            <span class="pixel-font text-lg text-green-400">${q.title}</span>
                            <span class="text-[10px] text-yellow-400 font-bold">${q.completed ? 'COMPLETADA ✅' : 'EN CURSO ⏳'}</span>
                        </div>
                        <p class="text-slate-300 mb-1">${q.desc}</p>
                        <p class="text-[10px] text-slate-400">Recompensa: ${q.rewardGold}g</p>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="w-full max-w-md">
                    <h3 class="pixel-font text-2xl text-green-400 mb-3 text-center">MISIONES DEL SISTEMA</h3>
                    <div class="space-y-2 mb-4 max-h-60 overflow-y-auto">${questsHtml}</div>
                    <button onclick="game.screen='lobby'; renderScreen();" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded pixel-font text-sm pixel-btn">VOLVER AL LOBBY</button>
                </div>
            `;
        }

        function renderNpcScreen(container) {
            container.innerHTML = `
                <div class="w-full max-w-md text-center">
                    <div class="pixel-card p-5 rounded border-2 border-blue-500/60 mb-4">
                        <span class="text-5xl mb-2 block animate-bounce">🤖</span>
                        <h3 class="pixel-font text-2xl text-blue-300 mb-2">IA ORÁCULO TÁCTICA</h3>
                        <p class="text-xs text-slate-300 leading-relaxed">
                            "Saludos, intrépido superviviente. La torre se vuelve más implacable a cada nivel superior. Recuerda equipar mejoras en tu mochila y usar escaleras de descenso si necesitas reabastecerte en el lobby."
                        </p>
                    </div>
                    <button onclick="game.screen='lobby'; renderScreen();" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded pixel-font text-sm pixel-btn">REGRESAR</button>
                </div>
            `;
        }

        // Initialize application on window load
        window.onload = function() {
            renderScreen();
        };
    </script>
</body>
</html>
