<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TORRE:SYSTEM // ULTIMATE PIXEL EDITION</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        retroDark: '#080c14',
                        retroCard: '#0f172a',
                        retroBorder: '#1e293b',
                        retroGreen: '#10b981',
                        retroBlue: '#3b82f6',
                        retroPurple: '#8b5cf6',
                        retroGold: '#f59e0b',
                        retroRed: '#ef4444'
                    },
                    fontFamily: {
                        mono: ['Courier New', 'Courier', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        .pixel-font { font-family: 'VT323', monospace; letter-spacing: 1px; }
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }
        .pixel-border {
            box-shadow: 0 0 0 2px #0f172a, 0 0 0 4px #334155, inset 0 0 0 2px #1e293b;
        }
        .pixel-border-gold {
            box-shadow: 0 0 0 2px #0f172a, 0 0 0 4px #f59e0b, inset 0 0 0 2px #d97706;
        }
        .pixel-btn {
            position: relative;
            transition: all 0.1s ease;
        }
        .pixel-btn:active {
            transform: translateY(2px);
        }
        /* Custom scrollbar for grid inventory */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-retroDark text-slate-100 font-mono min-h-screen flex flex-col items-center justify-between overflow-x-hidden select-none relative">
    
    <div class="crt-overlay absolute inset-0 z-50 pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="w-full max-w-md md:max-w-xl lg:max-w-2xl min-h-screen flex flex-col justify-between p-4 relative z-10">
        
        <!-- HEADER HEADER -->
        <header id="header-container" class="text-center py-2 border-b border-retroBorder mb-3">
            <h1 class="pixel-font text-3xl md:text-4xl text-cyan-400 font-bold tracking-widest drop-shadow-[0_0_10px_rgba(6,182,212,0.6)]">TORRE:SYSTEM // V4.5</h1>
            <p id="sub-header" class="text-xs text-slate-400 tracking-wider">SISTEMA TÁCTICO DE SUPERVIVENCIA EN TORRES</p>
        </header>

        <!-- DYNAMIC SCREEN CONTAINER -->
        <main id="main-view" class="flex-grow flex flex-col justify-center items-center my-2">
            <!-- Dynamically populated by JS -->
        </main>

        <!-- FOOTER STATUS / CREDITS -->
        <footer class="text-center py-2 text-[10px] text-slate-500 border-t border-retroBorder/50 mt-2">
            TORRE:SYSTEM ULTIMATE PIXEL EDITION &bull; ENGINE V4.5
        </footer>
    </div>

    <!-- NOTIFICATION MODAL / TOAST -->
    <div id="toast-modal" class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 hidden">
        <div class="bg-retroCard border-2 border-retroBorder p-5 rounded max-w-sm w-full text-center pixel-border shadow-2xl">
            <h3 id="toast-title" class="pixel-font text-2xl text-yellow-400 mb-2">NOTIFICACIÓN</h3>
            <p id="toast-msg" class="text-sm text-slate-300 mb-4">Mensaje del sistema...</p>
            <button onclick="closeToast()" class="bg-cyan-600 hover:bg-cyan-500 text-black font-bold px-6 py-2 rounded pixel-font text-lg tracking-wider">ACEPTAR</button>
        </div>
    </div>

    <script>
        // Audio Synthesizer for Retro SFX
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'victory') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(400, now + 0.1);
                osc.frequency.setValueAtTime(600, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'potion') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.2);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // Base Game State
        let game = {
            screen: 'title', // title, create, lobby, floor, combat, inventory, shop, npc
            player: {
                name: 'Aventurero',
                title: 'Novato Prometedor',
                classId: 'warrior', // warrior, rogue, mage, paladin
                level: 1,
                exp: 0,
                maxExp: 100,
                hp: 190,
                maxHp: 190,
                mp: 80,
                maxMp: 80,
                // Core stats
                str: 15,
                spd: 12,
                mag: 10,
                def: 10,
                luck: 5,
                trait: 'Golpe Furioso: +20% Daño Físico',
                skillName: 'Corte Táctico',
                skillCost: 15,
                skillDesc: 'Inflige 150% de daño de Fuerza.',
                gold: 150,
                equipment: {
                    weapon: null,   // { id, name, type, atk, def, icon }
                    shield: null,
                    helmet: null,
                    armor: null,
                    boots: null,
                    ring: null
                },
                // Grid Inventory (Max 16 slots)
                inventory: [
                    { id: 'pot_hp', name: 'Poción de Vida', type: 'potion', effect: 'hp', val: 50, qty: 4, icon: '🔴', desc: 'Restaura 50 PV.' },
                    { id: 'pot_mp', name: 'Poción de Mana', type: 'potion', effect: 'mp', val: 30, qty: 2, icon: '🔵', desc: 'Restaura 30 PM.' },
                    { id: 'pot_str', name: 'Elixir de Fuerza', type: 'potion', effect: 'str', val: 5, qty: 1, icon: '🟡', desc: 'Aumenta Fuerza temporalmente.' }
                ]
            },
            floor: 1,
            grid: [], // 7x7 grid
            playerPos: { x: 3, y: 6 },
            enemy: null,
            npc: null,
            combatTurn: 1,
            log: []
        };

        // Available Classes for Creation
        const AVAILABLE_CLASSES = {
            warrior: { id: 'warrior', name: 'Guerrero', icon: '🛡️', color: 'text-red-400', border: 'border-red-500', hp: 220, str: 18, spd: 10, mag: 5, def: 14, luck: 5, trait: 'Resistencia Titánica: -15% daño recibido', skillName: 'Estocada Brutal', skillCost: 15, skillDesc: 'Golpe pesado con 160% de Fuerza.' },
            rogue: { id: 'rogue', name: 'Asesino', icon: '🗡️', color: 'text-emerald-400', border: 'border-emerald-500', hp: 160, str: 16, spd: 20, mag: 8, def: 8, luck: 15, trait: 'Golpe Crítico: +25% Prob. Crítica', skillName: 'Puñalada Sombra', skillCost: 12, skillDesc: 'Ataque rápido y preciso.' },
            mage: { id: 'mage', name: 'Mago Arcano', icon: '🧙‍♂️', color: 'text-cyan-400', border: 'border-cyan-500', hp: 130, str: 8, spd: 12, mag: 22, def: 6, luck: 10, trait: 'Sintonía de Maná: +20% PM máximo', skillName: 'Rayo de Fuego', skillCost: 20, skillDesc: 'Lanza una descarga mágica pura.' },
            paladin: { id: 'paladin', name: 'Paladín', icon: '⚔️', color: 'text-amber-400', border: 'border-amber-500', hp: 200, str: 14, spd: 9, mag: 14, def: 16, luck: 8, trait: 'Bendición Divina: Regenera 5 PV por turno', skillName: 'Juicio Sagrado', skillCost: 18, skillDesc: 'Daño físico y mágico combinado.' }
        };

        // Items and Shop Pool
        const SHOP_ITEMS = [
            { id: 'pot_hp', name: 'Poción de Vida', type: 'potion', effect: 'hp', val: 50, price: 35, icon: '🔴', desc: 'Restaura 50 PV.' },
            { id: 'pot_mp', name: 'Poción de Mana', type: 'potion', effect: 'mp', val: 30, price: 30, icon: '🔵', desc: 'Restaura 30 PM.' },
            { id: 'eq_sword1', name: 'Espada de Hierro', type: 'weapon', slot: 'weapon', atk: 8, price: 120, icon: '🗡️', desc: 'Arma básica de hierro. +8 ATK.' },
            { id: 'eq_helm1', name: 'Casco de Soldado', type: 'armor', slot: 'helmet', def: 5, price: 90, icon: '🪖', desc: 'Protege la cabeza. +5 DEF.' },
            { id: 'eq_armor1', name: 'Cota de Malla', type: 'armor', slot: 'armor', def: 10, price: 180, icon: '🛡️', desc: 'Armadura corporal resistente. +10 DEF.' },
            { id: 'eq_boots1', name: 'Botas de Cuero', type: 'armor', slot: 'boots', spd: 4, def: 3, price: 85, icon: '👢', desc: 'Ligeras y cómodas. +4 SPD, +3 DEF.' }
        ];

        // Monster Database with Classic Pixel Slimes & Goblins
        const MONSTER_TYPES = [
            { name: 'Slime Azul Ácido', hp: 70, atk: 12, def: 4, exp: 35, gold: 20, type: 'slime', color: 'border-blue-500 text-blue-400', drop: 'Gelatina Azul' },
            { name: 'Slime Verde Tóxico', hp: 85, atk: 15, def: 5, exp: 45, gold: 25, type: 'slime', color: 'border-green-500 text-green-400', drop: 'Núcleo de Slime' },
            { name: 'Goblin Explorador', hp: 90, atk: 18, def: 6, exp: 50, gold: 30, type: 'goblin', color: 'border-amber-500 text-amber-400', drop: 'Oreja de Goblin' },
            { name: 'Goblin Guerrero', hp: 120, atk: 22, def: 9, exp: 70, gold: 45, type: 'goblin', color: 'border-red-500 text-red-400', drop: 'Daga Rota' }
        ];

        function renderPixelAvatar(classId, equipment = {}, size = 96) {
            let hasHelmet = equipment.helmet ? true : false;
            let hasWeapon = equipment.weapon ? true : false;
            let hasArmor = equipment.armor ? true : false;
            
            let classColor = '#3b82f6';
            if (classId === 'warrior') classColor = '#ef4444';
            if (classId === 'rogue') classColor = '#10b981';
            if (classId === 'mage') classColor = '#06b6d4';
            if (classId === 'paladin') classColor = '#f59e0b';

            return `
            <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="mx-auto drop-shadow-md">
                <!-- Background Pixel Glow -->
                <rect x="3" y="3" width="18" height="18" rx="2" fill="#0f172a" stroke="${classColor}" stroke-width="1"/>
                <!-- Body / Armor -->
                <rect x="8" y="13" width="8" height="7" fill="${hasArmor ? '#64748b' : classColor}" />
                <!-- Head / Face -->
                <rect x="9" y="7" width="6" height="6" fill="#fcd34d" />
                <!-- Eyes -->
                <rect x="10" y="9" width="1" height="1" fill="#1e293b" />
                <rect x="13" y="9" width="1" height="1" fill="#1e293b" />
                <!-- Helmet Overlayer -->
                ${hasHelmet ? `<rect x="8" y="6" width="8" height="3" fill="#94a3b8"/><rect x="9" y="5" width="6" height="1" fill="#cbd5e1"/>` : ''}
                <!-- Weapon Overlayer -->
                ${hasWeapon ? `<rect x="17" y="10" width="2" height="8" fill="#e2e8f0"/><rect x="16" y="12" width="4" height="1" fill="#b45309"/>` : ''}
            </svg>`;
        }

        function renderPixelMonster(type, size = 96) {
            if (type === 'slime') {
                return `
                <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="mx-auto animate-bounce">
                    <!-- Classic Gel Slime Shape -->
                    <path d="M4 16C4 12 8 8 12 8C16 8 20 12 20 16C20 19 18 20 12 20C6 20 4 19 4 16Z" fill="#38bdf8" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.5"/>
                    <!-- Highlight reflection -->
                    <ellipse cx="9" cy="12" rx="2" ry="1" fill="white" fill-opacity="0.6"/>
                    <!-- Cute Slime Eyes -->
                    <rect x="9" y="13" width="1.5" height="2.5" fill="#0f172a" rx="0.5"/>
                    <rect x="13" y="13" width="1.5" height="2.5" fill="#0f172a" rx="0.5"/>
                </svg>`;
            } else {
                // Goblin Pixel Art
                return `
                <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="mx-auto">
                    <!-- Goblin Body -->
                    <rect x="8" y="12" width="8" height="8" fill="#4d7c0f"/>
                    <!-- Big Pointy Ears -->
                    <polygon points="4,8 8,11 8,7" fill="#65a30d"/>
                    <polygon points="20,8 16,11 16,7" fill="#65a30d"/>
                    <!-- Head & Nose -->
                    <rect x="8" y="7" width="8" height="6" fill="#65a30d"/>
                    <rect x="12" y="9" width="4" height="2" fill="#3f6212"/>
                    <!-- Red/Yellow Eyes -->
                    <rect x="9" y="8" width="1.5" height="1.5" fill="#facc15"/>
                    <rect x="13.5" y="8" width="1.5" height="1.5" fill="#facc15"/>
                </svg>`;
            }
        }

        function initGame() {
            game.screen = 'title';
            render();
        }

        function render() {
            const main = document.getElementById('main-view');
            main.innerHTML = '';

            if (game.screen === 'title') {
                main.innerHTML = `
                <div class="text-center py-6">
                    <div class="mb-6 flex justify-center">
                        <div class="p-4 bg-retroCard border-2 border-cyan-500 rounded-xl pixel-border shadow-[0_0_25px_rgba(6,182,212,0.3)]">
                            <i class="fa-solid fa-chess-rook text-6xl text-cyan-400 animate-pulse"></i>
                        </div>
                    </div>
                    <h2 class="pixel-font text-4xl text-cyan-300 mb-2 font-bold">TORRE:SYSTEM</h2>
                    <p class="text-xs text-slate-400 mb-8 max-w-xs mx-auto">Despierta en lo profundo de las mazmorras cibernéticas y conquista los pisos de la torre.</p>
                    <div class="space-y-3 w-full max-w-xs mx-auto">
                        <button onclick="playSound('click'); game.screen='create'; render();" class="w-full bg-cyan-600 hover:bg-cyan-500 text-black font-bold py-3 rounded pixel-font text-xl tracking-wider transition shadow-lg">NUEVA PARTIDA</button>
                    </div>
                </div>`;
            } else if (game.screen === 'create') {
                let cls = AVAILABLE_CLASSES[game.player.classId];
                main.innerHTML = `
                <div class="w-full">
                    <h2 class="pixel-font text-2xl text-center text-cyan-400 mb-3">CREACIÓN DE AVATAR</h2>
                    <div class="bg-retroCard p-4 rounded-xl border border-retroBorder mb-4 pixel-border">
                        <div class="text-center mb-3">
                            ${renderPixelAvatar(game.player.classId, game.player.equipment, 80)}
                            <div class="text-xs text-slate-400 mt-2">Apariencia y Clase Seleccionada</div>
                        </div>
                        <div class="mb-3">
                            <label class="text-xs text-cyan-400 block mb-1">ELIGE TU CLASE</label>
                            <div class="grid grid-cols-2 gap-2">
                                ${Object.keys(AVAILABLE_CLASSES).map(k => {
                                    let c = AVAILABLE_CLASSES[k];
                                    let active = game.player.classId === k ? 'border-cyan-400 bg-cyan-950/40' : 'border-slate-700 bg-retroDark';
                                    return `<button onclick="playSound('click'); selectClass('${k}')" class="p-2 border rounded text-left ${active} hover:border-cyan-500 transition">
                                        <div class="font-bold text-sm ${c.color}">${c.icon} ${c.name}</div>
                                        <div class="text-[10px] text-slate-400">PV:${c.hp} ATK:${c.str}</div>
                                    </button>`;
                                }).join('')}
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="text-xs text-cyan-400 block mb-1">NOMBRE / APODO</label>
                            <input type="text" id="player-name-input" value="${game.player.name}" class="w-full bg-retroDark border border-retroBorder p-2 rounded text-cyan-300 pixel-font text-lg text-center" maxlength="15">
                        </div>
                    </div>
                    <button onclick="confirmCharacter()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-3 rounded pixel-font text-xl tracking-wider shadow-lg">COMENZAR ASCENSO</button>
                </div>`;
            } else if (game.screen === 'lobby') {
                main.innerHTML = `
                <div class="w-full text-center">
                    <div class="bg-retroCard p-4 rounded-xl border border-retroBorder mb-4 pixel-border flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-14 h-14 bg-retroDark rounded border border-cyan-500 flex items-center justify-center">
                                ${renderPixelAvatar(game.player.classId, game.player.equipment, 50)}
                            </div>
                            <div class="text-left">
                                <div class="font-bold text-cyan-300">${game.player.name}</div>
                                <div class="text-xs text-slate-400">Nv. ${game.player.level} &bull; ${AVAILABLE_CLASSES[game.player.classId].name}</div>
                                <div class="text-xs text-yellow-400"><i class="fa-solid fa-coins"></i> ${game.player.gold} Oro</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-slate-400">PISO ACTUAL</div>
                            <div class="pixel-font text-2xl text-cyan-400">#${game.floor}</div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <button onclick="playSound('click'); game.screen='floor'; initFloor(); render();" class="p-4 bg-cyan-950/60 hover:bg-cyan-900/60 border border-cyan-600 rounded-xl pixel-border text-center transition">
                            <i class="fa-solid fa-stairs text-2xl text-cyan-400 mb-1"></i>
                            <div class="pixel-font text-lg text-cyan-300">EXPLORAR TORRE</div>
                        </button>
                        <button onclick="playSound('click'); game.screen='inventory'; render();" class="p-4 bg-purple-950/60 hover:bg-purple-900/60 border border-purple-600 rounded-xl pixel-border text-center transition">
                            <i class="fa-solid fa-id-card text-2xl text-purple-400 mb-1"></i>
                            <div class="pixel-font text-lg text-purple-300">INVENTARIO & ESTADO</div>
                        </button>
                        <button onclick="playSound('click'); game.screen='shop'; render();" class="p-4 bg-amber-950/60 hover:bg-amber-900/60 border border-amber-600 rounded-xl pixel-border text-center transition">
                            <i class="fa-solid fa-store text-2xl text-amber-400 mb-1"></i>
                            <div class="pixel-font text-lg text-amber-300">TIENDA</div>
                        </button>
                        <button onclick="playSound('click'); showToast('Sistema', 'Progreso guardado correctamente.');" class="p-4 bg-slate-800/60 hover:bg-slate-700/60 border border-slate-600 rounded-xl pixel-border text-center transition">
                            <i class="fa-solid fa-floppy-disk text-2xl text-slate-300 mb-1"></i>
                            <div class="pixel-font text-lg text-slate-200">GUARDAR</div>
                        </button>
                    </div>
                </div>`;
            } else if (game.screen === 'inventory') {
                renderInventoryScreen(main);
            } else if (game.screen === 'shop') {
                renderShopScreen(main);
            } else if (game.screen === 'floor') {
                renderFloorScreen(main);
            } else if (game.screen === 'combat') {
                renderCombatScreen(main);
            } else if (game.screen === 'npc') {
                renderNpcScreen(main);
            }
        }

        function selectClass(cid) {
            game.player.classId = cid;
            let c = AVAILABLE_CLASSES[cid];
            game.player.hp = c.hp;
            game.player.maxHp = c.hp;
            game.player.str = c.str;
            game.player.spd = c.spd;
            game.player.mag = c.mag;
            game.player.def = c.def;
            game.player.luck = c.luck;
            game.player.trait = c.trait;
            game.player.skillName = c.skillName;
            game.player.skillCost = c.skillCost;
            game.player.skillDesc = c.skillDesc;
            render();
        }

        function confirmCharacter() {
            const input = document.getElementById('player-name-input');
            if (input && input.value.trim() !== '') {
                game.player.name = input.value.trim();
            }
            playSound('victory');
            game.screen = 'lobby';
            render();
        }

        function renderInventoryScreen(main) {
            let p = game.player;
            let cls = AVAILABLE_CLASSES[p.classId];
            
            main.innerHTML = `
            <div class="w-full">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="pixel-font text-2xl text-purple-400">INVENTARIO & ESTADO</h2>
                    <button onclick="playSound('click'); game.screen='lobby'; render();" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 px-3 py-1 rounded text-xs border border-slate-600">[ VOLVER ]</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                    <!-- Character Details & Stats & Equipment -->
                    <div class="bg-retroCard p-3 rounded-xl border border-purple-500/50 pixel-border">
                        <div class="flex items-center space-x-3 mb-3">
                            <div class="w-16 h-16 bg-retroDark rounded border border-purple-400 flex items-center justify-center">
                                ${renderPixelAvatar(p.classId, p.equipment, 56)}
                            </div>
                            <div>
                                <div class="font-bold text-cyan-300">${p.name}</div>
                                <div class="text-xs text-purple-300">${p.title} &bull; ${cls.name}</div>

        function useInventoryItem(index) {
            let item = game.player.inventory[index];
            if (!item) return;
            if (item.type === 'potion') {
                playSound('potion');
                if (item.effect === 'hp') {
                    game.player.hp = Math.min(game.player.maxHp, game.player.hp + item.val);
                    showToast('Objeto Usado', `Has restaurado ${item.val} PV.`);
                } else if (item.effect === 'mp') {
                    game.player.mp = Math.min(game.player.maxMp, game.player.mp + item.val);
                    showToast('Objeto Usado', `Has restaurado ${item.val} PM.`);
                } else if (item.effect === 'str') {
                    game.player.str += item.val;
                    showToast('Objeto Usado', `¡Tu fuerza aumentó temporalmente en +${item.val}!`);
                }
                item.qty--;
                if (item.qty <= 0) {
                    game.player.inventory.splice(index, 1);
                }
                render();
            } else {
                showToast('Aviso', 'Este objeto no se puede consumir directamente aquí. Equípalo en combate o desde el menú.');
            }
        }

        function renderShopScreen(main) {

        function buyItem(idx) {
            let item = SHOP_ITEMS[idx];
            if (game.player.gold >= item.price) {
                game.player.gold -= item.price;
                playSound('victory');
                
                // If it's equipment, auto-equip or add to inventory
                if (item.type === 'weapon' || item.type === 'armor') {
                    // Check if it's armor slot
                    let slot = item.slot || 'armor';
                    if (item.type === 'weapon') slot = 'weapon';
                    
                    // Equip directly or replace
                    game.player.equipment[slot] = item;
                    // Apply stats
                    if (item.atk) game.player.str += item.atk;
                    if (item.def) game.player.def += item.def;
                    if (item.spd) game.player.spd += item.spd;
                    showToast('¡Compra Exitosa!', `Has comprado y equipado: ${item.name}`);
                } else {
                    // Add potion to inventory
                    let existing = game.player.inventory.find(i => i.id === item.id);
                    if (existing) {
                        existing.qty++;
                    } else {
                        if (game.player.inventory.length >= 16) {
                            showToast('Mochila Llena', 'No tienes espacio en la mochila.');
                            game.player.gold += item.price; // refund
                            return;
                        }
                        game.player.inventory.push({ ...item, qty: 1 });
                    }
                    showToast('¡Compra Exitosa!', `Has adquirido ${item.name}`);
                }
                render();
            } else {
                showToast('Fondos Insuficientes', 'No tienes suficiente oro para comprar este objeto.');
            }
        }

        function initFloor() {
            game.grid = [];
            // 7x7 grid generation
            for(let y=0; y<7; y++) {

                    row.push({ type: 'empty', explored: false });
                }
                game.grid.push(row);
            }
            game.playerPos = { x: 3, y: 6 };
            game.grid[6][3].explored = true;
            game.grid[6][3].type = 'start';
            
            // Place exit stairs at top
            let exitX = Math.floor(Math.random() * 7);
            game.grid[0][exitX].type = 'exit';

            // Place random encounters / chests
            for(let y=1; y<6; y++) {
                for(let x=0; x<7; x++) {
                    let r = Math.random();
                    if (r < 0.25) game.grid[y][x].type = 'monster';
                    else if (r < 0.35) game.grid[y][x].type = 'chest';
                }
            }
        }

        function renderFloorScreen(main) {

                <!-- 7x7 Grid View -->

                    <div class="grid grid-cols-7 gap-1.5 w-[280px] h-[280px]">
                        ${game.grid.map((row, y) => row.map((cell, x) => {

                                bg = 'bg-cyan-950 border-cyan-400 shadow-[0_0_10px_rgba(6,182,212,0.5)]';

                <!-- Repositioned D-Pad & Backpack Quick Button Layout -->
                <div class="w-full flex items-center justify-between px-4">
                    <!-- Backpack Quick Button on the left side of D-Pad area -->
                    <button onclick="playSound('click'); game.screen='inventory'; render();" class="w-16 h-16 bg-purple-900/80 hover:bg-purple-800 border-2 border-purple-400 rounded-xl flex flex-col items-center justify-center shadow-lg active:scale-95 transition" title="Mochila / Inventario">

        function movePlayer(dx, dy) {
            let nx = game.playerPos.x + dx;
            let ny = game.playerPos.y + dy;
            if (nx < 0 || nx > 6 || ny < 0 || ny > 6) return;
            
            game.playerPos.x = nx;
            game.playerPos.y = ny;
            let cell = game.grid[ny][nx];

            if (cell.type === 'exit') {
                playSound('victory');
                game.floor++;
                
                // Check if NPC appears every 10 floors (Floor 10, 20, 30...)
                if (game.floor % 10 === 0) {
                    triggerRandomNpc();
                } else {
                    showToast('¡Piso Superado!', `Has ascendido al Piso ${game.floor}`);
                    initFloor();
                }
                render();
                return;
            } else if (cell.type === 'monster') {
                cell.type = 'empty';
                startCombat();
                return;
            } else if (cell.type === 'chest') {
                cell.type = 'empty';
                let goldFound = 30 + Math.floor(Math.random() * 40);
                game.player.gold += goldFound;
                playSound('victory');
                showToast('¡Cofre Encontrado!', `Has obtenido ${goldFound} monedas de oro.`);
            }
            render();
        }

        const NPC_POOL = [
            { name: 'Vendedor Errante Zeno', dialogue: '¡Saludos viajero! He recorrido 50 pisos de esta maldita torre. ¿Buscas un trato especial antes de continuar?', offerType: 'heal', cost: 50 },
            { name: 'Oráculo de la Torre', dialogue: 'El destino de este nivel está escrito en código binario. Te otorgaré sabiduría y bendición por tu valentía.', offerType: 'buff', cost: 40 },
            { name: 'Herrero Legendario Vane', dialogue: 'Tus armas muestran desgaste. Puedo afilar tu espada con acero cuántico si tienes algo de oro.', offerType: 'upgrade', cost: 70 }
        ];

        function triggerRandomNpc() {
            let randomNpc = NPC_POOL[Math.floor(Math.random() * NPC_POOL.length)];
            game.npc = randomNpc;
            game.screen = 'npc';
        }

        function renderNpcScreen(main) {
            let npc = game.npc;
            main.innerHTML = `
            <div class="w-full text-center">
                <div class="bg-retroCard p-5 rounded-xl border border-cyan-500 pixel-border mb-4">
                    <div class="w-20 h-20 bg-retroDark rounded-full border-2 border-cyan-400 mx-auto flex items-center justify-center mb-3 text-3xl shadow-[0_0_15px_rgba(6,182,212,0.4)]">
                        🧙‍♂️
                    </div>
                    <div class="pixel-font text-xl text-cyan-300 mb-1">${npc.name}</div>
                    <div class="text-xs text-slate-300 bg-retroDark p-3 rounded border border-retroBorder italic mb-4">"${npc.dialogue}"</div>
                    
                    <div class="space-y-2">
                        <button onclick="interactNpc('accept')" class="w-full bg-cyan-600 hover:bg-cyan-500 text-black font-bold py-2.5 rounded pixel-font text-lg">ACEPTAR INTERACCIÓN (${npc.cost} Oro)</button>
                        <button onclick="interactNpc('leave')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded pixel-font text-base border border-slate-600">CONTINUAR ASCENSO</button>
                    </div>
                </div>
            </div>`;
        }

        function interactNpc(action) {
            if (action === 'accept') {
                if (game.player.gold >= game.npc.cost) {
                    game.player.gold -= game.npc.cost;
                    playSound('victory');
                    if (game.npc.offerType === 'heal') {
                        game.player.hp = game.player.maxHp;
                        showToast('Bendición', '¡Salud completamente restaurada!');
                    } else if (game.npc.offerType === 'buff') {
                        game.player.str += 5;
                        game.player.def += 5;
                        showToast('Bendición', '¡Tus estadísticas de Fuerza y Defensa aumentaron permanentemente!');
                    } else if (game.npc.offerType === 'upgrade') {
                        game.player.str += 10;
                        showToast('Mejora Épica', '¡Tu equipo fue mejorado! +10 Fuerza.');
                    }
                } else {
                    showToast('Falta de Oro', 'No tienes suficiente oro para aceptar esta oferta.');
                    return;
                }
            }
            game.screen = 'floor';
            initFloor();
            render();
        }

        function startCombat() {
            let template = MONSTER_TYPES[Math.floor(Math.random() * MONSTER_TYPES.length)];
            let enemyLevel = Math.max(1, game.floor - Math.floor(Math.random() * 2));
            game.enemy = {
                name: template.name,
                type: template.type,
                level: enemyLevel,
                hp: template.hp + (enemyLevel * 15),
                maxHp: template.hp + (enemyLevel * 15),
                atk: template.atk + (enemyLevel * 3),
                def: template.def + enemyLevel,
                exp: template.exp * enemyLevel,
                gold: template.gold * enemyLevel,
                drop: template.drop
            };
            game.combatTurn = 1;
            game.screen = 'combat';
            playSound('hit');
            render();
        }

        function renderCombatScreen(main) {
            let e = game.enemy;
            let p = game.player;
            let hpPct = Math.max(0, Math.min(100, (p.hp / p.maxHp) * 100));
            let enemyHpPct = Math.max(0, Math.min(100, (e.hp / e.maxHp) * 100));

            main.innerHTML = `
            <div class="w-full">
                <div class="flex justify-between items-center mb-2">
                    <div class="pixel-font text-red-400 text-lg">COMBATE TÁCTICO</div>

                        <span class="text-red-400">${p.hp}/${p.maxHp} PV</span>
                    </div>
                    <div class="w-full bg-retroDark h-2 rounded overflow-hidden border border-slate-700">
                        <div class="bg-red-500 h-full transition-all duration-300" style="width: ${hpPct}%"></div>
                    </div>
                </div>

                <!-- Enemy Card with Pixel Art -->
                <div class="bg-retroCard p-4 rounded-xl border border-red-500/50 pixel-border text-center mb-3">

                        ${renderPixelMonster(e.type, 90)}
                    </div>
                    <div class="pixel-font text-xl text-amber-300 font-bold">${e.name}</div>
                    <div class="text-[10px] text-slate-400 mb-2">Nv. ${e.level}</div>
                    <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                        <span>PV ENEMIGO</span>
                        <span class="text-red-400">${e.hp}/${e.maxHp}</span>
                    </div>
                    <div class="w-full bg-retroDark h-2 rounded overflow-hidden border border-slate-700">
                        <div class="bg-red-600 h-full transition-all duration-300" style="width: ${enemyHpPct}%"></div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <button onclick="combatAction('attack')" class="bg-red-950/80 hover:bg-red-900 border border-red-600 text-red-300 font-bold py-3 rounded pixel-font text-lg transition shadow-lg">⚔️ ATACAR</button>
                    <button onclick="combatAction('skill')" class="bg-purple-950/80 hover:bg-purple-900 border border-purple-600 text-purple-300 font-bold py-3 rounded pixel-font text-lg transition shadow-lg">⚡ HABILIDAD</button>
                    <button onclick="combatAction('potion')" class="bg-emerald-950/80 hover:bg-emerald-900 border border-emerald-600 text-emerald-300 font-bold py-3 rounded pixel-font text-lg transition shadow-lg">🔴 POCIÓN</button>
                    <button onclick="combatAction('defend')" class="bg-blue-950/80 hover:bg-blue-900 border border-blue-600 text-blue-300 font-bold py-3 rounded pixel-font text-lg transition shadow-lg">🛡️ DEFENDER</button>
                </div>
            </div>`;
        }

        function combatAction(action) {
            let p = game.player;
            let e = game.enemy;

            if (action === 'attack') {
                let damage = Math.max(5, p.str - Math.floor(e.def / 2) + Math.floor(Math.random() * 6));
                e.hp -= damage;
                playSound('hit');
                showToast('Ataque', `Infliges ${damage} de daño a ${e.name}.`);
            } else if (action === 'skill') {
                if (p.mp >= p.skillCost) {
                    p.mp -= p.skillCost;
                    let damage = Math.max(12, (p.str * 1.5) - e.def + Math.floor(Math.random() * 10));
                    e.hp -= damage;
                    playSound('victory');
                    showToast('Habilidad Táctica', `¡${p.skillName}! Infliges ${damage} de daño.`);
                } else {
                    showToast('Mana Insuficiente', 'No tienes suficiente PM para usar esta habilidad.');
                    return;
                }
            } else if (action === 'potion') {
                let pot = p.inventory.find(i => i.id === 'pot_hp');
                if (pot && pot.qty > 0) {
                    playSound('potion');
                    p.hp = Math.min(p.maxHp, p.hp + 50);
                    pot.qty--;
                    if (pot.qty <= 0) p.inventory = p.inventory.filter(i => i.id !== 'pot_hp');
                    showToast('Poción', 'Has consumido una Poción de Vida (+50 PV).');
                } else {
                    showToast('Sin Pociones', 'No te quedan pociones de vida en la mochila.');
                    return;
                }
            } else if (action === 'defend') {
                playSound('click');
                showToast('Defensa', 'Adoptas postura defensiva reduciendo el daño entrante.');
            }

            // Check if enemy defeated
            if (e.hp <= 0) {
                playSound('victory');
                p.exp += e.exp;
                p.gold += e.gold;
                
                // Add monster drop to inventory
                let dropItem = { id: 'drop_' + Date.now(), name: e.drop, type: 'material', qty: 1, icon: '💎', desc: 'Objeto obtenido tras derrotar a un monstruo.' };
                let existing = p.inventory.find(i => i.name === e.drop);
                if (existing) existing.qty++;
                else if (p.inventory.length < 16) p.inventory.push(dropItem);

                // Level up check
                if (p.exp >= p.maxExp) {
                    p.level++;
                    p.exp = 0;
                    p.maxExp = Math.floor(p.maxExp * 1.3);
                    p.maxHp += 25;
                    p.hp = p.maxHp;
                    p.maxMp += 15;
                    p.mp = p.maxMp;
                    p.str += 4;
                    p.spd += 3;
                    showToast('¡SUBES DE NIVEL!', `¡Has alcanzado el Nivel ${p.level}! Estadísticas mejoradas.`);
                } else {
                    showToast('¡Victoria!', `Has derrotado a ${e.name}. Obtienes ${e.exp} EXP y ${e.gold} Oro.`);
                }

                game.screen = 'floor';
                render();
                return;
            }

            // Enemy Counter-attack
            let enemyDmg = Math.max(3, e.atk - Math.floor(p.def / 2) + Math.floor(Math.random() * 4));
            if (action === 'defend') enemyDmg = Math.floor(enemyDmg * 0.5);
            p.hp -= enemyDmg;
            game.combatTurn++;

            if (p.hp <= 0) {
                playSound('hit');
                showToast('Derrota', 'Has caído en combate. Regresando al lobby...');
                p.hp = Math.floor(p.maxHp * 0.5);
                game.screen = 'lobby';
                render();
                return;
            }

            render();
        }

        // Toast Helpers
        function showToast(title, msg) {
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-modal').classList.remove('hidden');
        }

        function closeToast() {
            document.getElementById('toast-modal').classList.add('hidden');
            render();
        }

        // Run on load
        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
